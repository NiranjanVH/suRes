name: Price Action Pro Signal Check

on:
  repository_dispatch:
    types: [run_signal_check]
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle timeframe (e.g. 5m, 15m, 1h)"
        required: false
        default: "5m"
        type: string
      tick:
        description: "Tick size"
        required: false
        default: "0.1"
        type: string
      decimals:
        description: "Price decimal places"
        required: false
        default: "2"
        type: string
      send:
        description: "Send alert to Telegram"
        required: false
        default: "true"
        type: string

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check for BTCUSDT, ZECUSDT, and XAUUSDT
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          INTERVAL_VAL="${{ github.event.client_payload.interval || inputs.interval || '5m' }}"
          TICK_VAL="${{ github.event.client_payload.tick || inputs.tick || '0.1' }}"
          DECIMALS_VAL="${{ github.event.client_payload.decimals || inputs.decimals || '2' }}"
          SEND_VAL="${{ github.event.client_payload.send || inputs.send || 'true' }}"

          SEND_FLAG=""
          if [ "$SEND_VAL" = "true" ] || [ "$SEND_VAL" = "1" ]; then
            SEND_FLAG="--send"
          fi

          for pair in "B-BTC_USDT" "B-ZEC_USDT" "B-XAU_USDT"; do
            echo "=== Running check for ${pair} ==="
            python signal_runner.py \
              --pair "${pair}" \
              --interval "${INTERVAL_VAL}" \
              --tick "${TICK_VAL}" \
              --decimals "${DECIMALS_VAL}" \
              --show-history \
              $SEND_FLAG
          done
